# BF2 Round Replay upload settings (Linux). Lines are bash.
# Where the finished demos end up: the server's demos folder (mods/bf2/demos), or rotate_demo's target_root if the
# server moves them there with sv.autoDemoHook.
DEMO_DIR=/home/bf2/bf2server/mods/bf2/demos
# The private key this script logs in with (made with: ssh-keygen -t ed25519 -N "" -f /home/bf2/.ssh/bf2replay)
KEY=/home/bf2/.ssh/bf2replay
# Where to send them: user@host or user@host:port, as many as you like
TARGETS=(
  "bf2upload@replay.example.com"
#  "bf2upload@backup.example.org:2222"
)
# Optional: send only demos from this date on (YYYY-MM-DD; empty = everything in DEMO_DIR)
SINCE=""
# Optional: skip demos smaller than this (bytes). 0 = send all; the replay server drops rounds nobody played anyway.
MIN_BYTES=0
