# BF2 Round Replay: the game servers send their demos here. The user bf2upload can only use SFTP, only with a key
# listed in /etc/ssh/bf2replay_keys/bf2upload, and only sees /srv/bf2replay/upload (files go into incoming/).
Match User bf2upload
    AuthorizedKeysFile /etc/ssh/bf2replay_keys/%u
    ChrootDirectory /srv/bf2replay/upload
    ForceCommand internal-sftp -u 0002
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
# (back to the rest of sshd_config for everyone else)
Match all
