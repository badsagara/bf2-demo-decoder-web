# BF2 Round Replay behind nginx (only when nginx already runs on the VPS; install.sh was run with BF2R_WEB=none).
# Copy to /etc/nginx/sites-available/bf2replay, link into sites-enabled, set server_name, then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d replay.example.com        (HTTPS from Let's Encrypt; apt install certbot python3-certbot-nginx)
#
# (v224) Who may open what (the admin page, "Users and access"): nginx asks admin.mjs about every request (auth_request
# /_bf2r_gate) - while the site is open to guests the answer is always yes, at once; a part closed to a visitor: a page
# goes to /login, a file gets 401 / 403. (Caddy asks only while data/.access-gate is there.)

# (in the http block: this file is included there) a page opened in the browser, not a file a script fetches
map $http_sec_fetch_mode $bf2r_nav { navigate 1; default 0; }

server {
    listen 80;
    listen [::]:80;
    server_name replay.example.com;

    root /srv/bf2replay/site;
    index index.html;
    charset utf-8;   # (v182: the page's text - · … ★ - read right)
    charset_types text/html text/css application/javascript application/json text/plain text/xml;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;

    # (v224) the gate: every request below is asked about first
    auth_request /_bf2r_gate;
    location = /_bf2r_gate {
        internal;
        proxy_pass http://127.0.0.1:8781/admin/api/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-BF2R-Uri $request_uri;
        proxy_set_header X-BF2R-Nginx 1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    error_page 401 = @bf2r_401;
    error_page 403 = @bf2r_403;
    location @bf2r_401 { if ($bf2r_nav) { return 302 /login?next=$request_uri; } return 401; }
    location @bf2r_403 { if ($bf2r_nav) { return 302 /login?next=$request_uri&no=1; } return 403; }
    # the login page (admin.mjs), asked about by nobody
    location = /login {
        auth_request off;
        proxy_pass http://127.0.0.1:8781;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # the page is checked on every visit
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location = /version.json { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location /assets/ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }

    # link previews: /r/<round> and /p/<player> (data/share/r|p/*.html, written by ingest.mjs)
    location ~ ^/([rp])/([A-Za-z0-9_.-]+)$ {
        root /srv/bf2replay/data/share;
        default_type text/html;
        try_files /$1/$2.html =404;
        add_header Cache-Control "no-cache";
    }

    # pages for search engines (every round, player and map as plain HTML), the RSS feed, sitemap.xml, robots.txt
    # (data/www, written by ingest.mjs)
    location ~ ^/(rounds|players|maps|records)(/.*)?$ {
        root /srv/bf2replay/data/www;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /rss.xml { root /srv/bf2replay/data/www; default_type application/rss+xml; types { } add_header Cache-Control "no-cache"; }
    location = /sitemap.xml { root /srv/bf2replay/data/www; add_header Cache-Control "no-cache"; }
    location = /robots.txt { auth_request off; root /srv/bf2replay/data/www; add_header Cache-Control "no-cache"; }

    # the admin page (server/admin.mjs on 127.0.0.1:8781, behind a password: admin.mjs --set-password)
    location /admin {
        auth_request off;
        proxy_pass http://127.0.0.1:8781;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # rounds.json, decoded rounds (rounds/*.bfr), the demos (demos/*.bf2demo), kill spots (heat/*.json); the rest of
    # data/ stays private
    location ^~ /data/ {
        root /srv/bf2replay;
        location ^~ /data/logs/  { return 404; }
        location ^~ /data/empty/ { return 404; }
        location ^~ /data/bad/   { return 404; }
        location ~ ^/data/\.     { return 404; }
        location = /data/rounds.json { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
        location = /data/reprocess.json { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
        location ~ ^/data/heat/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
        location ~ ^/data/stats/ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
        location ~ ^/data/(rounds|demos)/ { types { } default_type application/octet-stream; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
    }
}
