# BF2 Round Replay behind nginx (only when nginx already runs on the VPS; install.sh was run with BF2R_WEB=none).
# Copy to /etc/nginx/sites-available/bf2replay, link into sites-enabled, set server_name, then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d replay.example.com        (HTTPS from Let's Encrypt; apt install certbot python3-certbot-nginx)
server {
    listen 80;
    listen [::]:80;
    server_name replay.example.com;

    root /srv/bf2replay/site;
    index index.html;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;

    # the page is checked on every visit
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location /assets/ { add_header Cache-Control "public, max-age=86400"; add_header X-Content-Type-Options nosniff always; }

    # rounds.json, decoded rounds (rounds/*.bfr), the demos (demos/*.bf2demo); the rest of data/ stays private
    location ^~ /data/ {
        root /srv/bf2replay;
        location ^~ /data/logs/  { return 404; }
        location ^~ /data/empty/ { return 404; }
        location ^~ /data/bad/   { return 404; }
        location ~ ^/data/\.     { return 404; }
        location = /data/rounds.json { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
        location ~ ^/data/(rounds|demos)/ { types { } default_type application/octet-stream; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
    }
}
